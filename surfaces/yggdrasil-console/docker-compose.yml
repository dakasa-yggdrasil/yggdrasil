services:
  yggdrasil-console:
    image: ${NODE_IMAGE}
    working_dir: /workspace
    command: sh -lc "npm ci && npm run dev -- --host 0.0.0.0 --port ${CONSOLE_PORT}"
    environment:
      CONSOLE_PORT: ${CONSOLE_PORT}
      VITE_YGGDRASIL_API_BASE_URL: ${CONSOLE_API_BASE_URL:-}
      VITE_YGGDRASIL_API_PROXY: ${CONSOLE_API_PROXY:-http://yggdrasil-core:9080}
    ports:
      - "${CONSOLE_PORT}:${CONSOLE_PORT}"
    volumes:
      - ../../surfaces/yggdrasil-console:/workspace
      - yggdrasil-console-node-modules:/workspace/node_modules

volumes:
  yggdrasil-console-node-modules:
