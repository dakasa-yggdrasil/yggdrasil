# goreleaser config for the yggdrasil CLI.
#
# Produces linux / macOS / Windows binaries for amd64 + arm64, plus
# archives and checksums, attaches them to the tagged GitHub Release.
#
# Run locally with a DRY check:
#   goreleaser release --snapshot --clean --skip=publish
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: yggdrasil
    main: ./cmd/yggdrasil
    binary: yggdrasil
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows/arm64 is rarely useful for a platform CLI.
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [ tar.gz ]
    format_overrides:
      - goos: windows
        formats: [ zip ]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} {{ .Version }}"
