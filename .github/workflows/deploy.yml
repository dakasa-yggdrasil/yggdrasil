name: Deploy

on:
  workflow_dispatch:
    inputs:
      component_kind:
        description: Ecosystem component kind.
        required: false
        default: product
        type: string
      component_name:
        description: Stable ecosystem component name.
        required: false
        default: yggdrasil
        type: string
      component_namespace:
        description: Stable ecosystem component namespace.
        required: false
        default: global
        type: string
      commit_sha:
        description: Source commit SHA forwarded by the core workflow.
        required: false
        default: ""
        type: string
      actor:
        description: Actor that triggered the source event.
        required: false
        default: ""
        type: string
      event_name:
        description: Source event name.
        required: false
        default: workflow_dispatch
        type: string
      environment:
        description: Target environment label.
        required: false
        default: production
        type: string
      commit_message:
        description: Optional source commit message.
        required: false
        default: ""
        type: string
      source_run_url:
        description: Optional source GitHub Actions run URL.
        required: false
        default: ""
        type: string
      source_run_id:
        description: Optional source GitHub Actions run ID.
        required: false
        default: ""
        type: string
      remediation_contract:
        description: Optional remediation contract identifier.
        required: false
        default: ""
        type: string
      remediation_type:
        description: Optional remediation action type.
        required: false
        default: ""
        type: string
      remediation_reason:
        description: Optional remediation reason.
        required: false
        default: ""
        type: string
      remediation_payload:
        description: Optional serialized remediation payload.
        required: false
        default: ""
        type: string
      remediation_bundle_name:
        description: Optional remediation bundle name.
        required: false
        default: ""
        type: string
      remediation_bundle_namespace:
        description: Optional remediation bundle namespace.
        required: false
        default: ""
        type: string
      remediation_bundle_kind:
        description: Optional remediation bundle kind.
        required: false
        default: ""
        type: string
      remediation_bundle_status:
        description: Optional remediation bundle status.
        required: false
        default: ""
        type: string
      remediation_bundle_summary:
        description: Optional remediation bundle summary.
        required: false
        default: ""
        type: string
      remediation_bundle_context:
        description: Optional serialized remediation bundle context.
        required: false
        default: ""
        type: string
      remediation_bundle_creation_reason_summary:
        description: Optional remediation bundle creation reason summary.
        required: false
        default: ""
        type: string
      remediation_bundle_creation_reason_comment:
        description: Optional remediation bundle creation reason comment.
        required: false
        default: ""
        type: string
      remediation_bundle_approval_status:
        description: Optional remediation bundle approval status.
        required: false
        default: ""
        type: string
      remediation_bundle_approval_summary:
        description: Optional remediation bundle approval summary.
        required: false
        default: ""
        type: string
      remediation_bundle_approval_comment:
        description: Optional remediation bundle approval comment.
        required: false
        default: ""
        type: string
      remediation_bundle_promotion_status:
        description: Optional remediation bundle promotion status.
        required: false
        default: ""
        type: string
      remediation_bundle_promotion_summary:
        description: Optional remediation bundle promotion summary.
        required: false
        default: ""
        type: string
      remediation_bundle_promotion_comment:
        description: Optional remediation bundle promotion comment.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Task
        uses: arduino/setup-task@v2

      - name: Summarize deploy request
        shell: bash
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Yggdrasil deploy request

          - Component: \`${{ inputs.component_kind }}:${{ inputs.component_namespace }}:${{ inputs.component_name }}\`
          - Environment: \`${{ inputs.environment }}\`
          - Source event: \`${{ inputs.event_name }}\`
          - Source actor: \`${{ inputs.actor || 'unknown' }}\`
          - Source SHA: \`${{ inputs.commit_sha || github.sha }}\`
          EOF

          if [ -n "${{ inputs.source_run_url }}" ]; then
            echo "- Source run: ${{ inputs.source_run_url }}" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "${{ inputs.remediation_type }}" ]; then
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"

          ## Remediation context

          - Contract: \`${{ inputs.remediation_contract || 'n/a' }}\`
          - Type: \`${{ inputs.remediation_type }}\`
          - Reason: \`${{ inputs.remediation_reason || 'n/a' }}\`
          EOF
          fi

          if [ -n "${{ inputs.remediation_bundle_name }}" ]; then
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"

          ## Remediation bundle context

          - Bundle: \`${{ inputs.remediation_bundle_namespace || 'global' }}/${{ inputs.remediation_bundle_name }}\`
          - Kind: \`${{ inputs.remediation_bundle_kind || 'n/a' }}\`
          - Status: \`${{ inputs.remediation_bundle_status || 'n/a' }}\`
          - Summary: ${{ inputs.remediation_bundle_summary || 'n/a' }}
          EOF

            if [ -n "${{ inputs.remediation_bundle_creation_reason_summary }}" ] || [ -n "${{ inputs.remediation_bundle_creation_reason_comment }}" ]; then
              echo "- Creation reason: ${{ inputs.remediation_bundle_creation_reason_summary || 'n/a' }}${{ inputs.remediation_bundle_creation_reason_comment && format(' · {0}', inputs.remediation_bundle_creation_reason_comment) || '' }}" >> "$GITHUB_STEP_SUMMARY"
            fi

            if [ -n "${{ inputs.remediation_bundle_approval_status }}" ] || [ -n "${{ inputs.remediation_bundle_approval_summary }}" ]; then
              echo "- Approval decision: ${{ inputs.remediation_bundle_approval_status || 'n/a' }}${{ inputs.remediation_bundle_approval_summary && format(' · {0}', inputs.remediation_bundle_approval_summary) || '' }}${{ inputs.remediation_bundle_approval_comment && format(' · {0}', inputs.remediation_bundle_approval_comment) || '' }}" >> "$GITHUB_STEP_SUMMARY"
            fi

            if [ -n "${{ inputs.remediation_bundle_promotion_status }}" ] || [ -n "${{ inputs.remediation_bundle_promotion_summary }}" ]; then
              echo "- Promotion review: ${{ inputs.remediation_bundle_promotion_status || 'n/a' }}${{ inputs.remediation_bundle_promotion_summary && format(' · {0}', inputs.remediation_bundle_promotion_summary) || '' }}${{ inputs.remediation_bundle_promotion_comment && format(' · {0}', inputs.remediation_bundle_promotion_comment) || '' }}" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Verify toolchain
        run: task doctor

      - name: Check architecture boundaries
        run: task arch:check

      - name: Validate compose configuration
        run: task config

      - name: Build production images
        run: task build:images
