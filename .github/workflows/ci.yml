name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

jobs:
  cli:
    name: CLI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Task
        uses: arduino/setup-task@v2

      - name: Verify toolchain
        run: task --version

      - name: Check architecture boundaries
        run: task arch:check

      - name: Run unit tests
        run: go test ./...

  product:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_PAT_SUBMODULES: ${{ secrets.GH_PAT_SUBMODULES }}

    steps:
      - name: Configure private GitHub checkout
        if: ${{ env.GH_PAT_SUBMODULES != '' }}
        run: git config --global url."https://${GH_PAT_SUBMODULES}@github.com/".insteadOf "https://github.com/"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ env.GH_PAT_SUBMODULES || github.token }}

      - name: Set up Task
        uses: arduino/setup-task@v2

      - name: Verify toolchain
        run: task doctor

      - name: Validate compose configuration
        run: task config

      - name: Start local stack
        run: task up

      - name: Bootstrap core manifests
        run: task bootstrap:core

      - name: Run live smoke checks
        run: task smoke

      - name: Build production images
        run: task build:images

      - name: Stop local stack
        if: always()
        run: task down

  installation-manager:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_PAT_SUBMODULES: ${{ secrets.GH_PAT_SUBMODULES }}

    steps:
      - name: Configure private GitHub checkout
        if: ${{ env.GH_PAT_SUBMODULES != '' }}
        run: git config --global url."https://${GH_PAT_SUBMODULES}@github.com/".insteadOf "https://github.com/"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Task
        uses: arduino/setup-task@v2

      - name: Verify toolchain
        run: task doctor

      - name: Validate installation manager and remote stack end-to-end through console/auth
        run: task install:smoke
