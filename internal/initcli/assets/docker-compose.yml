services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yggdrasil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yggdrasil}
      POSTGRES_DB: ${POSTGRES_DB:-yggdrasil}
    volumes:
      - yggdrasil-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-yggdrasil} -d ${POSTGRES_DB:-yggdrasil}
      interval: 5s
      timeout: 3s
      retries: 20

  # Opt-in AMQP rpc.Transport backend. Only started when the `amqp`
  # compose profile is activated:
  #
  #   docker compose --profile amqp up -d
  #
  # When inactive, the core boots HTTP-only (the HTTP transport is
  # always available). Leave BROKER_URL unset in .env to skip this
  # backend entirely.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    profiles: ["amqp"]
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-yggdrasil}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-yggdrasil}
    volumes:
      - yggdrasil-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 20

  yggdrasil-core:
    image: ${YGGDRASIL_CORE_IMAGE:-ghcr.io/dakasa-yggdrasil/yggdrasil-core:latest}
    restart: unless-stopped
    environment:
      # This stack is a local development environment and says so
      # explicitly. Core allows credential-free workflow dispatch,
      # event publishes, deploy, bootstrap and integration install only
      # while no matching credential is configured and YGGDRASIL_ENV
      # names a development environment (dev, development, local or
      # test). Since yggdrasil-core ADR-0022 an unset value no longer
      # counts as development. Set YGGDRASIL_ENV in .env to anything
      # else (for example "staging") to close those calls on a host
      # other people can reach, and set YGGDRASIL_DEPLOY_TOKEN there to
      # keep using the deploy-family routes. `production` or `prod`
      # turns on Core's boot gate, which needs secrets this stack does
      # not generate.
      YGGDRASIL_ENV: ${YGGDRASIL_ENV:-development}
      # Dedicated bearer for the deploy, bootstrap and integration-install
      # routes. Empty (the default) keeps those routes credential-free
      # while YGGDRASIL_ENV is a development value.
      YGGDRASIL_DEPLOY_TOKEN: ${YGGDRASIL_DEPLOY_TOKEN:-}
      PORT: "9080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-yggdrasil}
      DB_USER: ${POSTGRES_USER:-yggdrasil}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-yggdrasil}
      # Opt-in AMQP backend. Set BROKER_URL in .env to enable; empty
      # means HTTP-only.
      BROKER_URL: ${BROKER_URL:-}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-720}
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:-yggdrasil_session}
      AUTH_SESSION_COOKIE_SECURE: "false"
      HTTP_READ_HEADER_TIMEOUT_SECONDS: "10"
      HTTP_READ_TIMEOUT_SECONDS: "30"
      HTTP_WRITE_TIMEOUT_SECONDS: "30"
      HTTP_IDLE_TIMEOUT_SECONDS: "120"
      YGGDRASIL_BOOTSTRAP_ADMIN_USERNAME: ${YGGDRASIL_BOOTSTRAP_ADMIN_USERNAME:-}
      YGGDRASIL_BOOTSTRAP_ADMIN_PASSWORD: ${YGGDRASIL_BOOTSTRAP_ADMIN_PASSWORD:-}
      YGGDRASIL_BOOTSTRAP_ADMIN_EMAIL: ${YGGDRASIL_BOOTSTRAP_ADMIN_EMAIL:-}
      YGGDRASIL_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${YGGDRASIL_BOOTSTRAP_ADMIN_DISPLAY_NAME:-Admin}
      YGGDRASIL_BOOTSTRAP_MANIFESTS_PATH: /app/docs/bootstrap/seeds
    # Published on every host interface. Read the YGGDRASIL_ENV note
    # above before you run this stack on a host other people can reach.
    ports:
      - "${CORE_HTTP_PORT:-9080}:9080"
    depends_on:
      postgres:
        condition: service_healthy

  # Kubernetes adapter, consumed by workflows that apply K8s objects
  # in an adopter's cluster (e.g. yggdrasil-deploy-control-plane).
  # Needs a kubeconfig mounted; KUBECONFIG_PATH defaults to the
  # caller's ~/.kube/config.
  integration-kubernetes:
    image: ${INTEGRATION_KUBERNETES_IMAGE:-ghcr.io/dakasa-yggdrasil/integration-kubernetes:latest}
    restart: unless-stopped
    environment:
      YGGDRASIL_TRANSPORT: http
      ADAPTER_PORT: "8081"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - ${KUBECONFIG_PATH:-${HOME}/.kube/config}:/root/.kube/config:ro

  # Schema-migrations adapter (goose-postgres provider). Used by
  # workflows that apply versioned SQL migrations against a target
  # Postgres, including the core's own self-migration path.
  integration-schema-migrations:
    image: ${INTEGRATION_SCHEMA_MIGRATIONS_IMAGE:-ghcr.io/dakasa-yggdrasil/integration-schema-migrations:latest}
    restart: unless-stopped
    environment:
      YGGDRASIL_TRANSPORT: http
      ADAPTER_PORT: "8082"
      HEALTHCHECK_PORT: "8080"

volumes:
  yggdrasil-postgres-data:
  yggdrasil-rabbitmq-data:
